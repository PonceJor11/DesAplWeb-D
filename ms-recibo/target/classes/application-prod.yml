# ===== PERFIL PROD (valores desde variables de entorno) =====
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-prod:3306/bd_recibo?useSSL=true&serverTimezone=America/Lima}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate    # NO modifica el esquema: usar db/init.sql
    show-sql: false
logging:
  level:
    com.empresa: INFO

servicios:
  cliente:
    url: ${MS_CLIENTE_URL:http://ms-cliente:8081}
  servicio:
    url: ${MS_SERVICIO_URL:http://ms-servicio:8082}
