spring:
  application:
    name: ms-recibo
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   # dev por defecto; en produccion: prod
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
server:
  port: ${SERVER_PORT:8083}

# Validacion de referencias entre microservicios (idCliente / idServicio)
servicios:
  validar-referencias: true
