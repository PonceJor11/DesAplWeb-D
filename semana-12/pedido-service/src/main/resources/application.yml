spring:
  application:
    name: pedido-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   # dev por defecto; en produccion: prod
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
